<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDAN CARS</title>
    <link rel="stylesheet" href="sedan_css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: linear-gradient(90deg, #1e1e1e, #0a1f44);">
    <!-- Company Filter -->
    <div class="car-filters">
        <div class="select-wrapper">
            <select id="companyFilter" class="custom-select">
                <option value="all">All Companies</option>
                <option value="MarutiSuzuki">Maruti Suzuki</option>
                <option value="Hyundai">Hyundai</option>
                <option value="Honda">Honda</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Skoda">Skoda</option>
                <option value="Audi">Audi</option>
                <option value="Mercedes">Mercedes-Benz</option>
                <option value="BMW">BMW</option>
            </select>
        </div>
    </div>

    <!-- Cars Container -->
    <div class="cars-container" id="carsContainer">
        <!-- Cars will be dynamically added here -->
    </div>

    <!-- Car Details Modal -->
    <div id="carModal" class="car-modal">
        <div class="modal-content">
            
            <div class="car-details">
                <!-- Car details will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="sedan_js.js"></script>
</body>
</html>
