<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOLUXE - Payment</title>
    <link rel="stylesheet" href="booking.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <form id="paymentForm" class="form">
            <div class="logo">
                <h1>AUTOLUXE</h1>
                <p>Car Rental System</p>
            </div>
            
            <h2>Payment Details</h2>
            
            <div class="booking-summary">
                <h3>Booking Summary</h3>
                <div class="summary-details" id="bookingSummary">
                    <div class="summary-row">
                        <span class="summary-label">Car Model:</span>
                        <span class="summary-value" id="carModel">Loading...</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Rental Period:</span>
                        <span class="summary-value" id="rentalPeriod">Loading...</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Pickup Date:</span>
                        <span class="summary-value" id="pickupDate">Loading...</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Return Date:</span>
                        <span class="summary-value" id="returnDate">Loading...</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Daily Rate:</span>
                        <span class="summary-value" id="dailyRate">Loading...</span>
                    </div>
                    <div class="summary-row total-row">
                        <span class="summary-label">Total Amount:</span>
                        <span class="summary-value" id="totalAmount">Loading...</span>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="cardName">Name on Card</label>
                <input type="text" id="cardName" name="cardName" placeholder="Enter name on card" required>
                <span class="error" id="cardNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                <span class="error" id="cardNumberError"></span>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
                    <span class="error" id="expiryError"></span>
                </div>
                
                <div class="form-group half">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
                    <span class="error" id="cvvError"></span>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Complete Payment</button>
        </form>
    </div>
    <script src="payment.js"></script>
</body>
</html>
